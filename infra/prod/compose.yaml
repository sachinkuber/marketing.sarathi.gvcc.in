# Production stack (plan, Task 5): postgres, core, worker and dashboard, plus the one-shot `ops` (profile ops).
# Run from the repository root on the server, always with the settings file /opt/mkt/compose.env (a copy of
# infra/prod/compose.env.example); the images are built here from infra/prod/Dockerfile:
#   C='docker compose --env-file /opt/mkt/compose.env -f infra/prod/compose.yaml'
#   $C --profile ops build   (one service at a time on a shared host)
#   $C --profile ops run --rm ops prepare   (migrations, roles, queue)
#   $C up -d, and last, on every deployment: /opt/mkt/firewall/mkt-egress.sh check
# `--profile ops` on the build is needed: without it the ops image is not rebuilt, and `run` would use the old one
# and miss new migrations.
# Configuration and every secret come from root-owned 0600 env files in /opt/mkt/secrets (MKT_SECRETS moves
# the folder, for tests); infra/prod/secrets.example holds one placeholder file for each. Nothing secret is
# written here, in an image, a build argument or a command line.
#
# Limits (plan decision 4; ops, backup and offsite excluded, they run only at deployment and once a day): 2.0 processors
# and 4 GiB in total.
#   postgres 0.75 / 1.5 GiB, core 0.5 / 1 GiB, worker 0.5 / 1 GiB, dashboard 0.25 / 512 MiB.
# Networks (plan decision 3, the zones of spec 16), each scoped to the project (mkt_app, mkt_worker...):
#   app            core and dashboard: the only services a proxy reaches, and the only published ports.
#   worker         core and worker; internal (no route out).
#   data           postgres, core, worker, ops and backup; internal. Postgres publishes no port.
#   worker_egress  the worker alone: its way out, for the model provider. An ordinary bridge with a fixed
#                  bridge name (mkt-egress0 by default) and subnet, so the host firewall (infra/prod/firewall,
#                  installed before the stack starts) can key on it. Without that firewall it is unrestricted
#                  outbound. With it: TCP 443 to public addresses only, no private range, not the host. That is wider
#                  than plan decision 3 ("the model provider only"): a deviation awaiting the owner's approval
#                  (ruling R15, docs/operations.md). The worker reaches the core only on `worker`.
#   backup_egress  offsite alone: its way out, for the off-server copy. Like worker_egress, a fixed bridge name
#                  (mkt-bkegress0 by default) and subnet, and the same firewall: TCP 443 to public addresses only
#                  (owner decision 2026-11-18, ruling R19).
# Ports: the core and the dashboard listen on 127.0.0.1 only (4100 and 3100), for a proxy on the host. A proxy
# that runs in Docker joins them through infra/prod/compose.proxy-network.yaml instead (docs/operations.md).
name: mkt

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# Node services: no Linux capabilities (they listen above 1024 and run as `node`), no privilege gain.
x-node-hardening: &node-hardening
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  postgres:
    # PostgreSQL 17.11, the digest the tests use.
    image: postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    restart: unless-stopped
    env_file: ['${MKT_SECRETS:-/opt/mkt/secrets}/postgres.env']
    environment:
      POSTGRES_DB: mkt
    volumes:
      - pg:/var/lib/postgresql/data
    networks: [data]
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mkt']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 1536M }
    logging: *logging

  core:
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: core }
    restart: unless-stopped
    <<: *node-hardening
    env_file: ['${MKT_SECRETS:-/opt/mkt/secrets}/core.env']
    ports: ['127.0.0.1:4100:4000']
    networks: [app, worker, data]
    depends_on:
      postgres: { condition: service_healthy }
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 1G }
    logging: *logging

  worker:
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: worker }
    restart: unless-stopped
    <<: *node-hardening
    env_file: ['${MKT_SECRETS:-/opt/mkt/secrets}/worker.env']
    environment:
      CORE_URL: http://core:4000
    networks: [worker, data, worker_egress]
    depends_on:
      core: { condition: service_healthy }
    # Running jobs get 30 s to finish after a stop signal (apps/worker/src/main.ts); this leaves room past that.
    stop_grace_period: 45s
    healthcheck:
      # The worker serves nothing: the check is that its process (PID 1) is alive.
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 1G }
    logging: *logging

  dashboard:
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: dashboard }
    restart: unless-stopped
    <<: *node-hardening
    env_file: ['${MKT_SECRETS:-/opt/mkt/secrets}/dashboard.env']
    ports: ['127.0.0.1:3100:3000']
    networks: [app]
    depends_on:
      core: { condition: service_healthy }
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 512M }
    logging: *logging

  # One-shot, at deployment: `docker compose --profile ops run --rm ops [prepare]`, after a build with
  # `--profile ops` (a build without it leaves this image old). It reads the superuser's address (postgres.env)
  # and the run-time roles' passwords (roles.env).
  ops:
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: ops }
    profiles: [ops]
    restart: 'no'
    <<: *node-hardening
    env_file:
      - '${MKT_SECRETS:-/opt/mkt/secrets}/postgres.env'
      - '${MKT_SECRETS:-/opt/mkt/secrets}/roles.env'
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
    logging: *logging

  # The daily backup (plan decision 6, Task 8), in two one-shot services run one after the other by the host's
  # mkt-backup.service (`docker compose ... --profile ops run --rm -T backup`, then `... offsite`); split so the
  # one holding the database's credentials has no way out and the one with a way out holds none (ruling R18).
  # backup: infra/prod/backup/backup.sh. Reads the superuser's address (postgres.env) and the owner's age public
  # key (backup.env, optional so that `ops prepare` works before the owner has given it; backup.sh then refuses).
  # Writes the encrypted set to the host folder /opt/mkt/backups (root, 0700; MKT_BACKUP_DIR moves it, for
  # tests), so it runs as root, with no capabilities: it can write only where root owns the folder. It also keeps
  # the newest 7 sets there. On data only. restore.sh is in the same image (`--entrypoint mkt-restore`,
  # docs/operations.md "Restore").
  backup:
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: ops }
    profiles: [ops]
    restart: 'no'
    user: '0:0'
    <<: *node-hardening
    entrypoint: [/usr/local/bin/mkt-backup]
    env_file:
      - '${MKT_SECRETS:-/opt/mkt/secrets}/postgres.env'
      - path: '${MKT_SECRETS:-/opt/mkt/secrets}/backup.env'
        required: false
    volumes:
      - '${MKT_BACKUP_DIR:-/opt/mkt/backups}:/backups'
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
    logging: *logging

  # offsite: infra/prod/backup/offsite.sh, the off-server copy (rclone to the bucket). The same folder, read-only;
  # only the remote's settings (offsite.env, optional until the bucket is set up: the run then says it skipped);
  # no database credential, and not on data. Root (the folder is root's 0700), with no capabilities.
  offsite:
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: ops }
    profiles: [ops]
    restart: 'no'
    user: '0:0'
    <<: *node-hardening
    entrypoint: [/usr/local/bin/mkt-offsite]
    env_file:
      - path: '${MKT_SECRETS:-/opt/mkt/secrets}/offsite.env'
        required: false
    volumes:
      - '${MKT_BACKUP_DIR:-/opt/mkt/backups}:/backups:ro'
    networks: [backup_egress]
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 256M }
    logging: *logging

volumes:
  pg:

networks:
  app:
  worker:
    internal: true
  data:
    internal: true
  # The firewall (infra/prod/firewall/mkt-egress.sh) matches the bridge name: both read MKT_EGRESS_BRIDGE (default
  # mkt-egress0, at most 15 characters), kept in /opt/mkt/compose.env (--env-file). The subnet is fixed so it
  # never moves onto another network's range; set MKT_EGRESS_SUBNET only to avoid a clash with a range already
  # used on the host.
  # A test stack sets both to its own values (stack.test.mjs), so it can run beside `mkt` (docs/operations.md).
  # IPv6 off: the firewall rules are IPv4 only.
  worker_egress:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: ${MKT_EGRESS_BRIDGE:-mkt-egress0}
    ipam:
      config:
        - subnet: ${MKT_EGRESS_SUBNET:-10.247.73.0/24}
  # The offsite service's way out, for the off-server copy only. The same firewall limits it as the worker's
  # (owner decision 2026-11-18, ruling R19), keyed the same way: MKT_BACKUP_EGRESS_BRIDGE (default mkt-bkegress0,
  # at most 15 characters) in both, and a fixed subnet, MKT_BACKUP_EGRESS_SUBNET, changed only to avoid a clash.
  # A test stack sets both to its own values (stack.test.mjs, backup.test.mjs). IPv6 off.
  backup_egress:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: ${MKT_BACKUP_EGRESS_BRIDGE:-mkt-bkegress0}
    ipam:
      config:
        - subnet: ${MKT_BACKUP_EGRESS_SUBNET:-10.247.75.0/24}
