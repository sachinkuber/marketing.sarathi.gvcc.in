# Only when the proxy runs in Docker (as Caddy does on the staging host) and so cannot reach the host's
# 127.0.0.1:4100 and 3100. Adds the core and the dashboard, and nothing else, to the proxy's existing Docker
# network, under names no other project on that network uses. The proxy site then names mkt-core:4000 and
# mkt-dashboard:3000 (infra/prod/proxy/marketing.caddy). Every container on that network can then reach them.
#   MKT_PROXY_NETWORK=web docker compose -f infra/prod/compose.yaml -f infra/prod/compose.proxy-network.yaml up -d
# With Caddy on the host this file is not used (docs/operations.md, "How the proxy reaches the app").
services:
  core:
    networks:
      proxy:
        aliases: [mkt-core]
  dashboard:
    networks:
      proxy:
        aliases: [mkt-dashboard]

networks:
  proxy:
    name: ${MKT_PROXY_NETWORK:?set MKT_PROXY_NETWORK to the proxy's Docker network}
    external: true
